[project]
name = "agent"
version = "0.0.1"
description = "Backend for the LangGraph research agent (local directory search)"
authors = [
  { name = "Philipp Schmid", email = "schmidphilipp1995@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi",
  "python-dotenv>=1.0.1",

  # Core runtime (agent + graph)
  "langgraph>=0.2.6",
  "langchain>=0.3.19",
  "langchain-groq",
  "pydantic",

  # Dev server / local API (used by langgraph dev / quickstart tooling)
  "langgraph-sdk>=0.1.57",
  "langgraph-cli",
  "langgraph-api",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.1",
  "ruff>=0.6.1",
  "pytest>=8.3.5",
  "langgraph-cli[inmem]>=0.1.71",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
lint.select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "D",    # pydocstyle
  "D401", # First line should be in imperative mood
  "T201",
  "UP",
]
lint.ignore = [
  "UP006",
  "UP007",
  "UP035",
  "D417",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
